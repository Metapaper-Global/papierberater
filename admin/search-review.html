<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Review · Papierberater Admin</title>
<style>
  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --border: #e4e2db;
    --text: #1a1916;
    --text-muted: #6b6860;
    --green: #1a6b3c;
    --green-light: #edf7f1;
    --red: #c0392b;
    --red-light: #fdf0ef;
    --amber: #8a5c00;
    --amber-light: #fdf6e3;
    --radius: 8px;
    --font-ui: system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-ui); background: var(--bg); color: var(--text); min-height: 100vh; }

  header {
    background: #1a1916; color: #fff;
    padding: 14px 24px; display: flex; align-items: center; gap: 16px;
  }
  header a { color: rgba(255,255,255,0.6); font-size: 13px; text-decoration: none; }
  header a:hover { color: #fff; }
  header h1 { font-size: 16px; font-weight: 600; }

  .toolbar {
    padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .toolbar select, .toolbar input {
    padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius);
    font-size: 13px; background: var(--bg); color: var(--text); font-family: inherit;
  }
  .badge {
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px;
    background: var(--amber-light); color: var(--amber);
  }
  .badge.green { background: var(--green-light); color: var(--green); }
  .badge.red { background: var(--red-light); color: var(--red); }

  main { max-width: 1100px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }

  .log-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden;
  }
  .log-card-header {
    padding: 14px 18px; display: flex; align-items: flex-start; gap: 12px;
    border-bottom: 1px solid var(--border); cursor: pointer; user-select: none;
  }
  .log-card-header:hover { background: #fafaf8; }
  .log-query { font-size: 14px; font-weight: 600; flex: 1; }
  .log-meta { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  .log-status { flex-shrink: 0; }

  .log-card-body { padding: 16px 18px; display: none; }
  .log-card-body.open { display: block; }

  .results-grid {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .result-chip {
    padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500;
    background: #f1f0ec; color: var(--text); border: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px;
  }
  .result-chip .rank { font-size: 10px; color: var(--text-muted); }

  .parsed-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .parsed-tag {
    padding: 2px 8px; border-radius: 99px; font-size: 11px;
    background: #ebe9e4; color: var(--text-muted);
  }

  .review-actions { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }

  .btn {
    padding: 7px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 600;
    border: none; cursor: pointer; font-family: inherit; transition: opacity 0.15s;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-correct { background: var(--green-light); color: var(--green); }
  .btn-incorrect { background: var(--red-light); color: var(--red); }
  .btn-save { background: #1a1916; color: #fff; }

  .correction-form {
    margin-top: 12px; padding: 14px; background: var(--bg); border-radius: var(--radius);
    border: 1px solid var(--border); display: none; flex-direction: column; gap: 12px;
  }
  .correction-form.open { display: flex; }
  .correction-form label {
    display: block; font-size: 12px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px;
  }
  .correction-form textarea, .correction-form input[type="number"] {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius);
    font-size: 13px; background: var(--surface); font-family: inherit;
  }
  .correction-form textarea { resize: vertical; min-height: 60px; width: 100%; }

  /* Paper list */
  .paper-list { display: flex; flex-direction: column; gap: 4px; min-height: 32px; }
  .paper-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px;
  }
  .paper-rank {
    font-size: 10px; color: var(--text-muted); width: 18px;
    flex-shrink: 0; text-align: right;
  }
  .paper-name { flex: 1; font-size: 12px; font-weight: 500; }
  .paper-actions { display: flex; gap: 3px; }
  .paper-actions button {
    padding: 2px 6px; border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg); cursor: pointer; font-size: 11px; line-height: 1.4;
    font-family: inherit; color: var(--text);
  }
  .paper-actions button:hover:not(:disabled) { background: #ebe9e4; }
  .paper-actions button:disabled { opacity: 0.25; cursor: not-allowed; }
  .paper-actions .btn-rm { color: var(--red); border-color: #f0c0bc; }
  .paper-actions .btn-rm:hover { background: var(--red-light); }

  .add-paper-row { margin-top: 8px; position: relative; }
  .add-paper-row input[type="text"] {
    width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius);
    font-size: 13px; background: var(--surface); font-family: inherit;
  }
  .add-paper-row input[type="text"]:focus { outline: none; border-color: #999; }
  .paper-dropdown {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 200;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: 0 6px 20px rgba(0,0,0,0.1); max-height: 220px; overflow-y: auto; display: none;
  }
  .paper-dropdown.open { display: block; }
  .paper-dropdown-item {
    padding: 7px 12px; font-size: 12px; cursor: pointer; color: var(--text);
  }
  .paper-dropdown-item:hover { background: var(--bg); }
  .paper-dropdown-empty {
    padding: 10px 12px; font-size: 12px; color: var(--text-muted); font-style: italic;
  }

  .results-more { display: none; }
  .results-more.open { display: flex; }
  .btn-show-more {
    padding: 3px 10px; font-size: 11px; border: 1px solid var(--border); border-radius: 99px;
    background: var(--bg); cursor: pointer; color: var(--text-muted); font-family: inherit;
  }
  .btn-show-more:hover { background: #ebe9e4; color: var(--text); }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px; }
  .loading { text-align: center; padding: 60px; color: var(--text-muted); }

  .toast {
    position: fixed; bottom: 20px; right: 20px; padding: 10px 16px;
    background: #1a1916; color: #fff; border-radius: var(--radius);
    font-size: 13px; font-weight: 600; z-index: 9999;
    animation: slideIn 0.2s ease; pointer-events: none;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<header>
  <a href="/admin.html">← Admin</a>
  <h1>Search Review</h1>
  <span id="pendingBadge" class="badge" style="display:none"></span>
</header>

<div class="toolbar">
  <select id="filterStatus" onchange="load()">
    <option value="pending">Offen (ohne Bewertung)</option>
    <option value="all">Alle</option>
    <option value="correct">✓ Korrekt</option>
    <option value="incorrect">✗ Falsch</option>
  </select>
  <input id="filterQuery" type="text" placeholder="Suche in Queries…" oninput="renderFiltered()" style="width:200px">
  <span id="countLabel" style="font-size:12px;color:var(--text-muted)"></span>
</div>

<main id="main">
  <div class="loading">Lädt…</div>
</main>

<script>
const SUPABASE_URL = 'https://utpshgqhyijggfubzifp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV0cHNoZ3FoeWlqZ2dmdWJ6aWZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5Nzk4NjIsImV4cCI6MjA5MzU1NTg2Mn0.8B1Yg7rC1YTxxyrF_cT8ieeXitDbwQ_-ZHrkA_ScN2w';

function sbH(extra = {}) {
  return {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json',
    ...extra
  };
}

let allLogs = [];
let corrections = {};
let cardPapers = {};   // logId → [{id, name}]
let ALL_PAPERS = [];
let papersLoaded = false;

// ── Load all papers for the add-paper dropdown ──
async function loadAllPapers() {
  if (papersLoaded) return;
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/papier_masterliste?select=Brand_Identifier&order=Brand_Identifier.asc&limit=2000`,
      { headers: sbH() }
    );
    if (res.ok) {
      const rows = await res.json();
      ALL_PAPERS = rows
        .map(r => r.Brand_Identifier)
        .filter(Boolean)
        .filter(id => !id.toUpperCase().includes('MUNKEN LYNX'));
      papersLoaded = true;
    }
  } catch(e) { console.warn('loadAllPapers Fehler:', e); }
}

async function load() {
  document.getElementById('main').innerHTML = '<div class="loading">Lädt…</div>';

  const logsRes = await fetch(
    `${SUPABASE_URL}/rest/v1/search_logs?select=*&order=created_at.desc&limit=200`,
    { headers: sbH() }
  );
  allLogs = logsRes.ok ? await logsRes.json() : [];

  const logIds = allLogs.map(l => l.id);
  corrections = {};
  if (logIds.length) {
    const corrRes = await fetch(
      `${SUPABASE_URL}/rest/v1/search_corrections?select=*&search_log_id=in.(${logIds.join(',')})`,
      { headers: sbH() }
    );
    if (corrRes.ok) {
      const rows = await corrRes.json();
      for (const r of rows) corrections[r.search_log_id] = r;
    }
  }

  const pending = allLogs.filter(l => !corrections[l.id]).length;
  const badge = document.getElementById('pendingBadge');
  if (pending > 0) { badge.textContent = pending + ' offen'; badge.style.display = ''; }
  else badge.style.display = 'none';

  cardPapers = {}; // reset state on reload
  renderFiltered();
}

function renderFiltered() {
  const filterStatus = document.getElementById('filterStatus').value;
  const q = document.getElementById('filterQuery').value.toLowerCase();

  let logs = allLogs;
  if (filterStatus === 'pending') logs = logs.filter(l => !corrections[l.id]);
  else if (filterStatus === 'correct') logs = logs.filter(l => corrections[l.id]?.status === 'correct');
  else if (filterStatus === 'incorrect') logs = logs.filter(l => corrections[l.id]?.status === 'incorrect');
  if (q) logs = logs.filter(l => l.query.toLowerCase().includes(q));

  document.getElementById('countLabel').textContent = logs.length + ' Einträge';
  const main = document.getElementById('main');

  if (!logs.length) { main.innerHTML = '<div class="empty">Keine Einträge.</div>'; return; }
  main.innerHTML = logs.map(l => renderCard(l)).join('');

  // Re-render paper lists for already-open incorrect forms
  for (const log of logs) {
    const corr = corrections[log.id];
    if (corr?.status === 'incorrect') {
      initCardPapers(log.id, log);
      renderPaperList(log.id);
    }
  }
}

function initCardPapers(logId, log) {
  if (cardPapers[logId]) return; // already initialized
  const corr = corrections[logId];
  if (corr?.correct_papers?.length) {
    cardPapers[logId] = corr.correct_papers.map(id => ({ id, name: id }));
  } else {
    cardPapers[logId] = ((log || allLogs.find(l => l.id === logId))?.top_results || [])
      .map(r => ({ id: r.name || r.brand_id, name: r.name || r.brand_id }))
      .filter(p => p.id);
  }
}

function renderCard(log) {
  const corr = corrections[log.id];
  const date = new Date(log.created_at).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' });
  const pq = log.parsed_query || {};

  let statusBadge = '<span class="badge">Offen</span>';
  if (corr?.status === 'correct') statusBadge = '<span class="badge green">✓ Korrekt</span>';
  if (corr?.status === 'incorrect') statusBadge = '<span class="badge red">✗ Falsch</span>';

  const allResults = log.top_results || [];
  const topsFirst = allResults.slice(0, 5).map(r =>
    `<span class="result-chip"><span class="rank">#${r.rank}</span>${escH(r.name || r.brand_id)}</span>`
  ).join('');
  const topsRest = allResults.length > 5
    ? `<button class="btn-show-more" onclick="toggleMoreResults('${log.id}')">+${allResults.length - 5} weitere</button>
       <span class="results-more" id="more-${log.id}">${allResults.slice(5).map(r =>
         `<span class="result-chip"><span class="rank">#${r.rank}</span>${escH(r.name || r.brand_id)}</span>`
       ).join('')}</span>`
    : '';
  const tops = topsFirst + topsRest;

  const boolKeys = ['riso','indigo','offset','letterpress','scodix','inkjet','toner','heissfolie',
    'extrarau','rau','glatt','sehrGlatt','schwarz','weiss','warmweiss','kaltweiss','naturfarben',
    'recycling','recycling100','fsc','blauEngel','upcycling','nachhaltig',
    'visitenkarte','broschure','fanzine','magazin','kunstbuch','einladung','verpackung','nachhaltigkeitsbericht',
    'dick','leicht','guenstig'];
  const activeTags = boolKeys.filter(k => pq[k]);
  if (pq.minWeight || pq.maxWeight) activeTags.push(`${pq.minWeight||''}–${pq.maxWeight||''}g`);
  const tagsHtml = activeTags.map(t => `<span class="parsed-tag">${escH(t)}</span>`).join('');

  const isIncorrect = corr?.status === 'incorrect';

  return `
<div class="log-card" id="card-${log.id}">
  <div class="log-card-header" onclick="toggleCard('${log.id}')">
    <div style="flex:1">
      <div class="log-query">${escH(log.query)}</div>
      <div class="log-meta">${date} · ${log.lang || 'de'} · ${log.result_count ?? '?'} Ergebnisse</div>
    </div>
    <div class="log-status">${statusBadge}</div>
  </div>
  <div class="log-card-body${isIncorrect ? ' open' : ''}" id="body-${log.id}">
    ${tagsHtml ? `<div class="parsed-tags">${tagsHtml}</div>` : ''}
    <div class="results-grid">${tops || '<span style="color:var(--text-muted);font-size:12px">Keine Ergebnisse gespeichert</span>'}</div>

    <div class="review-actions">
      <button class="btn btn-correct" onclick="markCorrect('${log.id}')">✓ Korrekt</button>
      <button class="btn btn-incorrect" onclick="openForm('${log.id}')">✗ Falsch — Korrektur eingeben</button>
    </div>

    <div class="correction-form${isIncorrect ? ' open' : ''}" id="form-${log.id}">
      <div>
        <label>Richtige Reihenfolge</label>
        <div id="paper-list-${log.id}" class="paper-list"></div>
        <div class="add-paper-row">
          <input type="text" id="paper-search-${log.id}"
                 placeholder="Papier suchen und hinzufügen…"
                 oninput="filterPapers('${log.id}', this.value)"
                 onfocus="filterPapers('${log.id}', this.value)"
                 autocomplete="off">
          <div id="paper-dropdown-${log.id}" class="paper-dropdown"></div>
        </div>
      </div>
      <div>
        <label>Boost-Stärke (10–100, Standard: 30)</label>
        <input type="number" id="boost-${log.id}" min="10" max="100" value="${corr?.boost_score || 30}" style="width:110px">
      </div>
      <div>
        <label>Notiz (optional)</label>
        <textarea id="notes-${log.id}">${escH(corr?.notes || '')}</textarea>
      </div>
      <div>
        <button class="btn btn-save" onclick="saveCorrection('${log.id}')">Speichern</button>
      </div>
    </div>
  </div>
</div>`;
}

function toggleCard(id) {
  document.getElementById('body-' + id).classList.toggle('open');
}

function toggleMoreResults(id) {
  const el = document.getElementById('more-' + id);
  const btn = el?.previousElementSibling;
  if (!el) return;
  const isOpen = el.classList.toggle('open');
  if (btn) btn.textContent = isOpen ? 'Weniger' : '+' + el.querySelectorAll('.result-chip').length + ' weitere';
}

function openForm(logId) {
  const log = allLogs.find(l => l.id === logId);
  initCardPapers(logId, log);
  document.getElementById('form-' + logId).classList.add('open');
  document.getElementById('body-' + logId).classList.add('open');
  renderPaperList(logId);
  loadAllPapers();
}

// ── Paper list rendering ──
function renderPaperList(logId) {
  const el = document.getElementById('paper-list-' + logId);
  if (!el) return;
  const papers = cardPapers[logId] || [];

  if (!papers.length) {
    el.innerHTML = '<div style="color:var(--text-muted);font-size:12px;padding:6px 0">Keine Papiere ausgewählt</div>';
    return;
  }

  el.innerHTML = papers.map((p, i) => `
    <div class="paper-item">
      <span class="paper-rank">${i + 1}</span>
      <span class="paper-name">${escH(p.name)}</span>
      <div class="paper-actions">
        <button onclick="movePaper('${logId}',${i},-1)" ${i === 0 ? 'disabled' : ''} title="Nach oben">↑</button>
        <button onclick="movePaper('${logId}',${i},1)" ${i === papers.length - 1 ? 'disabled' : ''} title="Nach unten">↓</button>
        <button class="btn-rm" onclick="removePaper('${logId}',${i})" title="Entfernen">×</button>
      </div>
    </div>
  `).join('');
}

function movePaper(logId, idx, dir) {
  const arr = cardPapers[logId];
  const ni = idx + dir;
  if (ni < 0 || ni >= arr.length) return;
  [arr[idx], arr[ni]] = [arr[ni], arr[idx]];
  renderPaperList(logId);
}

function removePaper(logId, idx) {
  cardPapers[logId].splice(idx, 1);
  renderPaperList(logId);
}

// ── Paper search dropdown ──
function filterPapers(logId, query) {
  const dropdown = document.getElementById('paper-dropdown-' + logId);
  if (!dropdown) return;
  const q = (query || '').trim().toLowerCase();
  const selected = new Set((cardPapers[logId] || []).map(p => p.id));

  let matches;
  if (!papersLoaded) {
    dropdown.innerHTML = '<div class="paper-dropdown-empty">Lädt Papiere…</div>';
    dropdown.classList.add('open');
    loadAllPapers().then(() => filterPapers(logId, query));
    return;
  }

  if (q.length >= 1) {
    matches = ALL_PAPERS.filter(id => !selected.has(id) && id.toLowerCase().includes(q)).slice(0, 25);
  } else {
    matches = ALL_PAPERS.filter(id => !selected.has(id)).slice(0, 25);
  }

  if (!matches.length) {
    dropdown.innerHTML = '<div class="paper-dropdown-empty">Keine Treffer</div>';
  } else {
    dropdown.innerHTML = matches.map(id =>
      `<div class="paper-dropdown-item" data-paperid="${escH(id)}">${escH(id)}</div>`
    ).join('');
  }
  dropdown.onmousedown = function(e) {
    const item = e.target.closest('.paper-dropdown-item[data-paperid]');
    if (item) { e.preventDefault(); addPaper(logId, item.dataset.paperid); }
  };
  dropdown.classList.add('open');
}

function addPaper(logId, id) {
  if (!cardPapers[logId]) cardPapers[logId] = [];
  if (cardPapers[logId].some(p => p.id === id)) return;
  cardPapers[logId].push({ id, name: id });
  renderPaperList(logId);

  const input = document.getElementById('paper-search-' + logId);
  if (input) input.value = '';
  const dropdown = document.getElementById('paper-dropdown-' + logId);
  if (dropdown) dropdown.classList.remove('open');
}

// Close dropdowns on outside click
document.addEventListener('click', e => {
  if (!e.target.closest('.add-paper-row')) {
    document.querySelectorAll('.paper-dropdown.open').forEach(d => d.classList.remove('open'));
  }
});

// ── Mark correct ──
async function markCorrect(logId) {
  const existing = corrections[logId];
  let res;
  if (existing) {
    res = await fetch(`${SUPABASE_URL}/rest/v1/search_corrections?id=eq.${existing.id}`, {
      method: 'PATCH', headers: sbH({ 'Prefer': 'return=representation' }),
      body: JSON.stringify({ status: 'correct', correct_papers: null, notes: null, parsed_query: null })
    });
  } else {
    res = await fetch(`${SUPABASE_URL}/rest/v1/search_corrections`, {
      method: 'POST', headers: sbH({ 'Prefer': 'return=representation' }),
      body: JSON.stringify({ search_log_id: logId, status: 'correct' })
    });
  }
  if (res.ok) {
    const rows = await res.json();
    corrections[logId] = Array.isArray(rows) ? rows[0] : rows;
    delete cardPapers[logId];
    document.getElementById('card-' + logId).outerHTML = renderCard(allLogs.find(l => l.id === logId));
    showToast('Als korrekt markiert ✓');
  } else {
    showToast('Fehler: ' + res.status, true);
  }
}

// ── Save correction ──
async function saveCorrection(logId) {
  const papers = (cardPapers[logId] || []).map(p => p.id);
  const boost = parseInt(document.getElementById('boost-' + logId).value) || 30;
  const notes = document.getElementById('notes-' + logId).value.trim();
  const log = allLogs.find(l => l.id === logId);

  const payload = {
    search_log_id: logId,
    parsed_query: log?.parsed_query || null,
    status: 'incorrect',
    correct_papers: papers.length ? papers : null,
    boost_score: boost,
    notes: notes || null
  };

  const existing = corrections[logId];
  let res;
  if (existing) {
    res = await fetch(`${SUPABASE_URL}/rest/v1/search_corrections?id=eq.${existing.id}`, {
      method: 'PATCH', headers: sbH({ 'Prefer': 'return=representation' }),
      body: JSON.stringify(payload)
    });
  } else {
    res = await fetch(`${SUPABASE_URL}/rest/v1/search_corrections`, {
      method: 'POST', headers: sbH({ 'Prefer': 'return=representation' }),
      body: JSON.stringify(payload)
    });
  }

  if (res.ok) {
    const rows = await res.json();
    corrections[logId] = Array.isArray(rows) ? rows[0] : rows;
    delete cardPapers[logId]; // force re-init from saved data
    document.getElementById('card-' + logId).outerHTML = renderCard(allLogs.find(l => l.id === logId));
    initCardPapers(logId, log);
    renderPaperList(logId);
    showToast('Korrektur gespeichert');
  } else {
    showToast('Fehler: ' + res.status, true);
  }
}

function escH(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer;
function showToast(msg, isErr = false) {
  clearTimeout(toastTimer);
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.background = isErr ? '#c0392b' : '#1a6b3c';
  t.textContent = msg;
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), 2500);
}

load();
</script>
</body>
</html>
